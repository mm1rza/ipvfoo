<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>META SEO Inspector page analysis</title>
    <link rel="stylesheet" href="vendors/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="lib/theme_manager/themes.css">
    <link rel="stylesheet" href="styles/bootstrap_override.css">
    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: white;
            font-size: 16px;
            margin: 1em 3em;
        }

        a,
        a:hover {
            color: black
        }

        button {
            border: 0;
            background-color: gray;
            color: white;
            border-radius: 10px;
            padding: 5px 10px;
            text-transform: uppercase;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(125%);
        }

        .logo {
            vertical-align: bottom;
        }

        .attr_name,
        .attr_link {
            font-weight: bold;
            display: inline-block;
            text-align: right;
            padding-right: 2rem;
            white-space: nowrap;
        }

        [data-section="headers"] .attr_name {
            min-width: 4em;
        }

        [data-section="structureddata_microdata"] .values_list {
            display: block !important;
        }

        #externalr .ad_seo_item {
            flex-wrap: wrap;
        }

        #externalr table tr td:last-child {
            display: none;
        }

        .c0 {
            display: none;
        }

        .cundefined {
            border: 1px solid red;
        }

        h1 {
            word-break: break-all;
        }

        h2 {
            width: 100%;
            text-align: left;
            border-top: 2px solid gray;
            font-size: 1.35em;
            padding-top: 1em;
        }

        .ad_seo_title {
            font-weight: bold;
            margin: 1em 0 1em 0px;
            font-size: 1.2em;
        }

        .attr_link {
            color: black;
            text-decoration: none;
        }

        [data-trans] {
            border: 2px solid red;
        }

        .tip,
        .badge {
            display: none;
        }

        .ad_seo_item {
            display: flex;
        }

        .ccopy {
            display: none;
        }

        .flex-direction-column {
            flex-direction: column;
        }

        .ad_seo_item .item {
            font-weight: bold;
            padding-left: 0.5em;
        }

        .ad_seo_item.values_list {
            display: flex;
            word-break: break-all;
        }

        .ad_seo_item.values_list img {
            max-height: 100px;
            max-width: 150px;
            height: auto !important;
        }

        .ad_seo_item_inner {
            width: 100%;
        }

        .warning,
        .info {
            width: 97%;
            padding: 0 0.75em;
            margin: 2px 0;
            border-radius: 1em;
        }

        .warning span,
        .info span {
            padding-right: 0.5em;
        }

        .warning {
            border: 1px solid #d00;
            background-color: #d004;
        }

        .info {
            border: 1px solid #268fff;
            background-color: #268fff44;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            word-break: break-all;
        }

        th {
            white-space: nowrap;
            text-align: left;
        }

        td {
            vertical-align: top;
            border: 1px solid #888;
            padding: 1px 4px;
        }

        .extra {
            word-break: break-all;
        }

        table span.extra {
            display: none;
        }

        .str_H1 {
            padding-left: 0em
        }

        .str_H2 {
            padding-left: 1.5em
        }

        .str_H3 {
            padding-left: 3.0em
        }

        .str_H4 {
            padding-left: 4.5em
        }

        .str_H5 {
            padding-left: 6.0em
        }

        .str_H6 {
            padding-left: 7.5em
        }

        .report {
            padding-right: 16em;
        }

        main>nav {
            position: fixed;
            top: 0;
            right: 0em;
            width: 16em;
        }

        .section-nav li {
            border-left: 3px solid transparent;
            padding-left: 1em;
            line-height: 19px;
        }

        .section-nav li.active {
            border-left: 3px solid teal;
        }

        .section-nav li.active>a {
            color: #333;
            font-weight: 500;
        }

        .section-nav input {
            display: none;
            float: right;
        }

        .section-nav {
            padding-left: 0;
        }

        .section-nav ul {
            list-style-type: none;
            margin: 1em 0 3em 0;
        }

        .section-nav li.subsection {
            padding-left: 32px;
        }

        .section-nav a {
            text-decoration: none;
            display: block;
            padding: 0.125rem 0;
            color: #888;
            text-transform: lowercase;
            transition: color 150ms ease-in-out;
        }

        .section-nav a::first-letter {
            text-transform: uppercase;
        }

        .section-nav a:hover,
        .section-nav a:focus {
            color: #555;
        }

        .section-nav li.c0 {
            display: none;
        }

        .section-nav li.cundefined {
            border: 1px dashed red;
        }

        [data-section="html5"] span {
            background-color: black;
            filter: invert(1);
        }

        #print {
            margin-left: 4.5em;
            margin-right: 10px;
        }

        #print img,
        #copy img {
            filter: invert(100%);
            vertical-align: -50%;
            margin-right: 7px;
        }

        header a {
            color: black;
            text-decoration: none;
        }

        header a:hover {
            text-decoration: underline;
        }

        img.thumbnail {
            height: 40px;
            width: auto;
            max-width: 60px;
            max-height: 40px;
            margin: 0;
            vertical-align: middle;
        }

        .collapse:not(.show) {
            display: block;
        }

        .btn-secondary {
            background: transparent;
            color: black;
            border: 0;
            pointer-events: none;
        }

        .section_intro_outer {
            display: none;
        }

        @media print {
            main>nav {
                display: none;
            }

            .report {
                padding-right: 0;
            }
        }
    </style>
</head>

<body data-theme="light">
    <header>
        <h1>
            <a href="https://www.omiod.com/meta-seo-inspector/"><img src="images/48.png" class="logo"> META SEO
                Inspector page analysis</a>
        </h1>
    </header>
    <main>
        <div class="report"></div>
        <div id="out" class="img-container"></div>
        <nav class="section-nav">
        </nav>
    </main>

    <script src="scripts/print.js"></script>
</body>
</html>
